version: 0.2

env:
  secrets-manager:
    DB_HOST:     ATA_DB_CREDENTIALS:host
    DB_USERNAME: ATA_DB_CREDENTIALS:username
    DB_PASSWORD: ATA_DB_CREDENTIALS:password
    DB_PORT:     ATA_DB_CREDENTIALS:port
    DB_NAME:     ata-db-name:ata-db-name

phases:
  install:
    commands:
      - echo "Install phase entered...";
      - echo "Checking for backend file changes...";
      - |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD);
        if [[ "$CHANGED_FILES" != *"service/"* ]]; then 
          echo "No backend changes, skipping build."; 
          SKIP_BUILD=1;
          exit 0; 
        fi
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com"
  pre_build:
    commands:
      - if [[ $SKIP_BUILD == 1]]; then exit 0; fi;
      - echo "Pre-build phase entered..."
      - mkdir ./service/instance
      - cd ./service/instance
  build:
    commands:
      - if [[ $SKIP_BUILD == 1]]; then exit 0; fi;
      - echo "Build phase entered..."
      - printf "DB_HOST='$DB_HOST'\n" >> config.py
      - printf "DB_USER='$DB_USERNAME'\n" >> config.py
      - printf "DB_PASSWORD='$DB_PASSWORD'\n" >> config.py
      - printf "DB_PORT='$DB_PORT'\n" >> config.py 
      - printf "DB_NAME='$DB_NAME'\n" >> config.py
      - cd ..
      - docker build -t $AWS_ECR_REPOSITORY_URI .
  post_build:
    commands:
      - if [[ $SKIP_BUILD == 1]]; then exit 0; fi;
      - echo "Post-build phase entered..."
      - docker push $AWS_ECR_REPOSITORY_URI
artifacts:
  files:
    - '**/*'